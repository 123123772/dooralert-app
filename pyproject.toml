[project]
name = "door_alert_system"
version = "1.0.0"
description = "基于机器视觉的汽车开门后方来车预警系统"
authors = [{ name = "王影", email = "your-email@example.com" }]
requires-python = ">=3.9, <3.13"
dependencies = [
    "flet>=0.28.3",
    "ultralytics>=8.0.0",
    "opencv-python>=4.5.0",
    "numpy>=1.21.0",
    "pyyaml>=6.0",
]

[tool.flet]
org = "com.nmu.dooralert"
product = "DoorAlert"

[tool.flet.compile]
app = true
packages = false   # 关键：禁止编译第三方包
